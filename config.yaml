server:
  host: "0.0.0.0"
  port: 8000

model:
  # Model .pt/.onnx sẽ tự export sang OpenVINO; thư mục OpenVINO có sẵn được dùng trực tiếp.
  weights: "resources/models/yolov8s_openvino_model"
  conf: 0.7
  iou: 0.45
  imgsz: 480
  skip_frames: 0     # Infer trên mọi frame pipeline xử lý để giảm bỏ lỡ vật thể qua vạch.
  target_fps: 12     # FPS tối đa; FPS thực tế phụ thuộc hiệu năng CPU và được ghi log.
  metrics_log_interval_seconds: 10
  inference_timeout_seconds: 120
  classes:
    - 0  # person
    - 1  # bicycle
    - 2  # car
    - 3  # motorcycle
    - 5  # bus
    - 7  # truck
  device: "cpu"
  inference_api_host: "127.0.0.1"
  inference_api_port: 8001

database:
  path: "resources/database/events.db"
  snapshot_dir: "resources/database/snapshots"

cameras:
  # ROI sơ bộ theo frame mẫu 1920x1080; từng camera có tọa độ riêng để dễ hiệu chỉnh.
  - id: "cam_1"
    name: "Camera 1 - Front Gate"
    source: "resources/videos/C001.mp4"
    rtsp_out: "rtsp://localhost:8554/live/cam_1"
    enabled: true
    line_crossing:
      enabled: true
      point1: [500, 760]
      point2: [1770, 760]
    restricted_zone:
      enabled: true
      polygon:
        - [560, 650]
        - [1740, 650]
        - [1870, 860]
        - [470, 860]


  - id: "cam_2"
    name: "Camera 2 - Parking Lot"
    source: "resources/videos/C002.mp4"
    rtsp_out: "rtsp://localhost:8554/live/cam_2"
    enabled: true
    line_crossing:
      enabled: true
      point1: [520, 740]
      point2: [1780, 740]
    restricted_zone:
      enabled: true
      polygon:
        - [600, 640]
        - [1770, 640]
        - [1880, 850]
        - [490, 850]

  - id: "cam_3"
    name: "Camera 3 - Side Alley"
    source: "resources/videos/C003.mp4"
    rtsp_out: "rtsp://localhost:8554/live/cam_3"
    enabled: true
    line_crossing:
      enabled: true
      point1: [500, 780]
      point2: [1790, 780]
    restricted_zone:
      enabled: true
      polygon:
        - [570, 675]
        - [1780, 675]
        - [1900, 875]
        - [450, 875]

  - id: "cam_4"
    name: "Camera 4 - Backyard"
    source: "resources/videos/C004.mp4"
    rtsp_out: "rtsp://localhost:8554/live/cam_4"
    enabled: true
    line_crossing:
      enabled: true
      point1: [510, 750]
      point2: [1760, 750]
    restricted_zone:
      enabled: true
      polygon:
        - [590, 655]
        - [1730, 655]
        - [1850, 855]
        - [470, 855]
