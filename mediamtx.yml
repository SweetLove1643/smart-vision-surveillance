logLevel: info
logDestinations: [stdout]

rtmp: no
hls: no
webrtc: no
srt: no
moq: no
api: no
metrics: no
pprof: no
playback: no

rtspAddress: :8554
rtspTransports: [tcp]

authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:

paths:
  all_others:
    source: publisher
